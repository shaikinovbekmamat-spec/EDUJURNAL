<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - EduJurnal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert-success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .test-credentials {
            margin-top: 24px;
            padding: 16px;
            background-color: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
        }

        .test-credentials h3 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #333;
        }

        .test-credentials ul {
            list-style: none;
        }

        .test-credentials li {
            padding: 4px 0;
        }

        .test-credentials strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>EduJurnal</h1>
            <p>Электронный журнал и дневник</p>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <span th:text="${error}">Ошибка входа</span>
        </div>

        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}">Сообщение</span>
        </div>

        <form th:action="@{/perform-login}" method="post">
            <div class="form-group">
                <label for="phoneNumber">Номер телефона</label>
                <input type="text"
                       id="phoneNumber"
                       name="phoneNumber"
                       placeholder="0555123456"
                       required
                       autocomplete="username"
                       autofocus>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Введите пароль"
                       required
                       autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">Войти</button>
        </form>

        <div class="test-credentials">
            <h3>Тестовые учётные записи:</h3>
            <ul>
                <li><strong>Директор:</strong> 0555123456</li>
                <li><strong>Учитель:</strong> 0555234567</li>
                <li><strong>Ученик:</strong> 0555345678</li>
                <li style="margin-top: 8px;">Пароль для всех: <strong>password123</strong></li>
            </ul>
        </div>
    </div>
</body>
</html>
