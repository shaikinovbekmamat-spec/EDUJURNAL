<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - EduJurnal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            /* Более мягкий и современный градиент */
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            max-width: 420px;
            width: 100%;
            padding: 40px;
            position: relative;
        }

        /* Переключатель языка */
        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 13px;
            display: flex;
            gap: 8px;
            color: #666;
        }

        .lang-switch a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .lang-switch a.active {
            color: #333;
            text-decoration: none;
            cursor: default;
        }

        .lang-switch a:hover:not(.active) {
            text-decoration: underline;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            color: #1a1a2e;
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 15px;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input::placeholder {
            color: #a0aec0;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .test-credentials {
            margin-top: 32px;
            padding: 16px;
            background-color: #f1f5f9;
            border-radius: 10px;
            font-size: 13px;
            color: #475569;
            border-left: 4px solid #667eea;
        }

        .test-credentials h3 {
            font-size: 13px;
            margin-bottom: 10px;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .test-credentials ul {
            list-style: none;
        }

        .test-credentials li {
            padding: 3px 0;
            display: flex;
            justify-content: space-between;
        }

        .test-credentials strong {
            color: #667eea;
        }
    </style>
</head>
<body>
<div class="login-container">

    <!-- Переключатель языка (НФР 01) -->
    <div class="lang-switch">
        <a href="#" class="active">RU</a> |
        <a href="#">KG</a>
    </div>

    <div class="login-header">
        <h1>EduJurnal</h1>
        <p>Электронный журнал и дневник</p>
    </div>

    <div th:if="${error}" class="alert alert-error">
        <span>⚠️</span>
        <span th:text="${error}">Ошибка входа</span>
    </div>

    <div th:if="${message}" class="alert alert-success">
        <span>✅</span>
        <span th:text="${message}">Сообщение</span>
    </div>

    <form th:action="@{/perform-login}" method="post">
        <div class="form-group">
            <!-- ВАЖНО: name="login" и label изменены -->
            <label for="login">Логин</label>
            <input type="text"
                   id="login"
                   name="login"
                   placeholder="Введите ваш логин"
                   required
                   autocomplete="username"
                   autofocus>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Введите пароль"
                   required
                   autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login">Войти в систему</button>
    </form>

    <div class="test-credentials">
        <h3>Тестовые учётные записи:</h3>
        <ul>
            <li><span>Директор:</span> <strong>director1</strong></li>
            <li><span>Учитель:</span> <strong>teacher1</strong></li>
            <li><span>Ученик:</span> <strong>student1</strong></li>
            <li><span>Родитель:</span> <strong>parent1</strong></li>
            <li style="margin-top: 8px; border-top: 1px solid #cbd5e1; padding-top: 8px;">
                <span>Пароль для всех:</span> <strong>password123</strong>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
