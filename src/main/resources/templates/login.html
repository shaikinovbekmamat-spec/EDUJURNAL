<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - EduJournal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --page:#f7f8fa;
            --surface:#ffffff;
            --subtle:#f1f3f6;
            --border:#e5e8ee;
            --strong:#cbd1db;
            --text:#111827;
            --secondary:#4b5563;
            --muted:#7b8494;
            --brand:#2f5bea;
            --brand-soft:#eaf0ff;
            --success:#15803d;
            --success-soft:#e8f6ee;
            --warning:#b45309;
            --warning-soft:#fdf3e2;
            --danger:#b91c1c;
            --danger-soft:#fdecec;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text);
        }

        .login-container {
            background: var(--surface);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(47, 91, 234, 0.08);
            max-width: 420px;
            width: 100%;
            padding: 40px;
            position: relative;
            border: 1px solid var(--border);
        }

        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 13px;
            display: flex;
            gap: 8px;
            color: var(--muted);
        }

        .lang-switch a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
        }

        .lang-switch a.active {
            color: var(--text);
            text-decoration: none;
            cursor: default;
        }

        .lang-switch a:hover:not(.active) {
            text-decoration: underline;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            color: var(--text);
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.6px;
        }

        .login-header p {
            color: var(--muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            background-color: var(--surface);
            transition: all 0.2s ease;
            color: var(--text);
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--brand);
            background-color: var(--surface);
            box-shadow: 0 0 0 3px var(--brand-soft);
        }

        .form-group input::placeholder {
            color: var(--muted);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            font-family: inherit;
        }

        .btn-login:hover {
            background: #2347c9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(47, 91, 234, 0.25);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-error {
            background-color: var(--danger-soft);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .alert-success {
            background-color: var(--success-soft);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .test-credentials {
            margin-top: 32px;
            padding: 20px;
            background: var(--subtle);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .test-credentials h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }

        .test-credentials ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .test-credentials li {
            padding: 6px 0;
            font-size: 13px;
            color: var(--secondary);
        }

        .test-credentials li span {
            color: var(--muted);
        }

        .test-credentials li strong {
            color: var(--brand);
            font-weight: 600;
        }

    </style>
</head>
<body>
<div class="login-container">

    <div class="lang-switch">
        <a href="#" class="active">RU</a> |
        <a href="#">KG</a>
    </div>

    <div class="login-header">
        <h1>EduJournal</h1>
        <p>Электронный журнал и дневник</p>
    </div>

    <div th:if="${error}" class="alert alert-error">
        <span>⚠️</span>
        <span th:text="${error}">Ошибка входа</span>
    </div>

    <div th:if="${message}" class="alert alert-success">
        <span>✅</span>
        <span th:text="${message}">Сообщение</span>
    </div>

    <form th:action="@{/perform-login}" method="post">
        <div class="form-group">
            <label for="login">Логин</label>
            <input type="text"
                   id="login"
                   name="login"
                   placeholder="Введите ваш логин"
                   required
                   autocomplete="username"
                   autofocus>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Введите пароль"
                   required
                   autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login">Войти в систему</button>
    </form>

    <div class="test-credentials">
        <h3>Тестовые учётные записи:</h3>
        <ul>
            <li><span>Директор:</span> <strong>director1</strong></li>
            <li><span>Учитель:</span> <strong>teacher1</strong></li>
            <li><span>Ученик:</span> <strong>student1</strong></li>
            <li><span>Родитель:</span> <strong>parent1</strong></li>
            <li style="margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px;">
                <span>Пароль для всех:</span> <strong>password123</strong>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
