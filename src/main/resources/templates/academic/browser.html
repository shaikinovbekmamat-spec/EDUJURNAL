<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="browse">
<nav class="browse-steps" th:if="${browser.staff}" aria-label="Выбор ученика"><a th:href="${path}">01 · Классы</a><a th:if="${browser.classId != null}" th:href="@{${path}(classId=${browser.classId})}">02 · Ученики</a><span th:if="${browser.studentId != null}" th:text="|03 · ${selectedName}|"></span></nav>
<section th:if="${browser.staff and browser.studentId == null}" class="browser-panel"><h2 th:text="${browser.classId == null ? 'Выберите класс' : 'Выберите ученика'}"></h2><form method="get" class="filters"><input th:if="${browser.classId != null}" type="hidden" name="classId" th:value="${browser.classId}"><label>Поиск по названию или имени<input name="search" th:value="${browser.search}" maxlength="100" placeholder="Начните вводить…"></label><button>Найти</button></form><div class="choice-grid"><a class="choice" th:each="c:${browser.classes}" th:href="@{${path}(classId=${c.id})}"><strong th:text="${c.name}"></strong><span>Открыть класс</span></a><a class="choice" th:each="s:${browser.students}" th:href="@{${path}(classId=${browser.classId},studentId=${s.id})}"><strong th:text="${s.name}"></strong><span>Открыть учебные записи</span></a></div><p th:if="${#lists.isEmpty(browser.classes) and #lists.isEmpty(browser.students)}" class="empty">Ничего не найдено. Измените поиск.</p><nav class="pagination"><a th:if="${browser.page > 0}" th:href="@{${path}(classId=${browser.classId},search=${browser.search},page=${browser.page - 1})}">Назад</a><span th:text="|Страница ${browser.page + 1}|"></span><a th:if="${browser.more}" th:href="@{${path}(classId=${browser.classId},search=${browser.search},page=${browser.page + 1})}">Далее</a></nav></section>
<form th:if="${!browser.staff or browser.studentId != null}" method="get" class="filters browser-filters"><input type="hidden" name="family" th:value="${view.family}"><input th:if="${browser.classId != null}" type="hidden" name="classId" th:value="${browser.classId}"><input th:if="${browser.studentId != null}" type="hidden" name="studentId" th:value="${browser.studentId}"><label th:if="${view.family}">Ребёнок<select name="childId"><option th:each="c:${view.children}" th:value="${c.id}" th:selected="${c.id == view.childId}" th:text="|${c.name} · ${c.school}|"></option></select></label><label>Учебный год<select name="yearId"><option th:each="y:${view.years}" th:value="${y.id}" th:selected="${y.id == view.yearId}" th:text="${y.name}"></option></select></label><label>Период<select name="quarterId"><option value="">Весь год</option><option th:each="q:${view.quarters}" th:value="${q.id}" th:selected="${q.id == view.quarterId}" th:text="${q.name}"></option></select></label><label>Предмет<select name="subject"><option value="">Все предметы</option><option th:each="s:${subjectChoices}" th:value="${s}" th:selected="${s == subjectFilter}" th:text="${s}"></option></select></label><button>Показать</button><a th:href="@{${path}(family=${view.family},childId=${view.childId},classId=${browser.classId},studentId=${browser.studentId})}">Сбросить фильтры</a></form>
</div>
<nav th:fragment="pages" class="pagination" th:if="${!browser.staff or browser.studentId != null}" aria-label="Страницы записей"><a th:if="${pageNumber > 0}" th:href="@{${path}(family=${view.family},childId=${view.childId},classId=${browser.classId},studentId=${browser.studentId},yearId=${view.yearId},quarterId=${view.quarterId},subject=${subjectFilter},page=${pageNumber - 1})}">Назад</a><span th:text="|Страница ${pageNumber + 1} · до 30 уроков|"></span><a th:if="${more}" th:href="@{${path}(family=${view.family},childId=${view.childId},classId=${browser.classId},studentId=${browser.studentId},yearId=${view.yearId},quarterId=${view.quarterId},subject=${subjectFilter},page=${pageNumber + 1})}">Далее</a></nav>
</body></html>
