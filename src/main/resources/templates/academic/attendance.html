<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учебные записи — EduJournal</title><link rel="stylesheet" href="/css/academic.css"><link rel="stylesheet" href="/css/navigation.css"><link rel="stylesheet" href="/css/journal-browser.css"></head><body class="app-shell records-app"><aside th:replace="~{academic/layout :: sidebar}"></aside><main class="workspace records-workspace"><header class="records-header"><div><h1>Посещаемость</h1><p>Отметки и исправления по урокам выбранного ученика.</p></div><a th:if="${user.role.name() == 'TEACHER'}" href="/attendance?family=true">Мои дети</a></header><p th:if="${success}" class="success" th:text="${success}"></p><div th:replace="~{academic/browser :: browse}"></div><section class="records-panel" th:if="${!browser.staff or browser.studentId != null}"><h2 th:text="${subjectFilter == '' ? 'Все предметы' : subjectFilter}"></h2><p th:if="${#lists.isEmpty(rows)}" class="empty">За выбранный период уроков нет.</p><div class="table-wrap" th:unless="${#lists.isEmpty(rows)}"><table><thead><tr><th>Дата урока</th><th>Предмет</th><th>Посещаемость</th><th>Причина / действия</th></tr></thead><tbody><tr th:each="e:${rows}" th:with="m=${attendance.mark(e.lessonId,e.studentId)}"><td><strong th:text="${#temporals.format(e.date,'dd.MM.yyyy')}"></strong><small th:text="${e.time}"></small></td><td th:text="${e.subject}"></td><td><span class="status-tag" th:attr="data-status=${m.status}" th:text="${m.label()}"></span></td><td><span th:text="${m.reason}"></span><details th:if="${view.teacher}"><summary th:text="${m.version == 0 ? 'Отметить' : 'Исправить'}"></summary><form th:action="@{/journal/attendance}" method="post" class="edit-attendance"><input type="hidden" name="lessonId" th:value="${e.lessonId}"><input type="hidden" name="studentId" th:value="${e.studentId}"><input type="hidden" name="version" th:value="${m.version}"><input type="hidden" name="classId" th:value="${browser.classId}"><label>Статус<select name="status" required><option value="">Выберите</option><option th:each="s:${ {'PRESENT','ABSENT','LATE'} }" th:value="${s}" th:selected="${s == m.status}" th:text="${attendance.label(s)}"></option></select></label><label>Причина отсутствия<input name="reason" maxlength="1000" th:value="${m.reason}"></label><label th:if="${m.version > 0}">Причина исправления<input name="correction" maxlength="1000" required></label><button>Сохранить</button><a th:href="@{/attendance/history(lessonId=${e.lessonId},studentId=${e.studentId})}">История исправлений</a></form></details></td></tr></tbody></table></div></section><nav th:replace="~{academic/browser :: pages}"></nav></main></body></html>
