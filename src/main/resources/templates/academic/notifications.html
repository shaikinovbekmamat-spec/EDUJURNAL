<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Уведомления — EduJournal</title><link rel="stylesheet" href="/css/academic.css"><link rel="stylesheet" href="/css/navigation.css"><link rel="stylesheet" href="/css/journal-browser.css"></head><body class="app-shell records-app"><aside th:replace="~{academic/layout :: sidebar}"></aside><main class="workspace records-workspace"><header class="records-header"><div><h1>Уведомления</h1><p>Посещаемость ваших детей. Последние учебные даты — в начале списка.</p></div></header><nav class="browse-steps" aria-label="Виды уведомлений"><a href="/notifications/schedule">Расписание</a><a href="/notifications?type=attendance" aria-current="page">Посещаемость</a></nav><form method="get" class="filters browser-filters"><input type="hidden" name="type" value="attendance"><label>Ребёнок<select name="childId"><option value="">Все дети</option><option th:each="c:${children}" th:value="${c.id}" th:selected="${c.id == childId}" th:text="|${c.name} · ${c.school}|"></option></select></label><label>Показать<select name="unread"><option value="false" th:selected="${!unread}">Все уведомления</option><option value="true" th:selected="${unread}">Только непрочитанные</option></select></label><button>Показать</button></form><p class="empty" th:if="${#lists.isEmpty(notifications)}">Уведомлений по выбранным условиям нет.</p><th:block th:each="n,iter:${notifications}"><h2 class="notification-day" th:if="${iter.first or notifications[iter.index - 1].lesson_date != n.lesson_date}" th:text="${#dates.format(n.lesson_date,'dd.MM.yyyy')}"></h2><article class="notification-row" th:classappend="${n.read_at == null ? 'unread' : ''}"><div><h3 th:text="${n.full_name}"></h3><small th:text="|${n.subject} · ${n.start_time}|"></small><p><span class="status-tag" th:attr="data-status=${n.status}" th:text="${attendance.label(n.status)}"></span></p><p th:if="${n.version > 1}">Отметка исправлена. Показан актуальный статус.</p><p th:unless="${#strings.isEmpty(n.reason)}" th:text="${n.reason}"></p><small th:text="${n.read_at == null ? 'Не прочитано' : 'Прочитано'}"></small></div><form th:if="${n.read_at == null}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post"><button>Отметить прочитанным</button></form></article></th:block><nav class="pagination" aria-label="Страницы уведомлений"><a th:if="${pageNumber > 0}" th:href="@{/notifications(type='attendance',childId=${childId},unread=${unread},page=${pageNumber - 1})}">Назад</a><span th:text="|Страница ${pageNumber + 1}|"></span><a th:if="${more}" th:href="@{/notifications(type='attendance',childId=${childId},unread=${unread},page=${pageNumber + 1})}">Далее</a></nav></main></body></html>
