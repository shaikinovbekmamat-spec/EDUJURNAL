<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Объявления и замечания — EduJournal</title><link rel="stylesheet" href="/css/academic.css"><link rel="stylesheet" href="/css/navigation.css"><link rel="stylesheet" href="/css/journal-browser.css"></head><body class="app-shell records-app"><aside th:replace="~{academic/layout :: sidebar}"></aside><main class="workspace records-workspace"><p><a th:href="@{/messages(kind=${message.kind})}">К списку</a></p><article class="records-panel"><h1 th:text="${message.title}"></h1><p th:text="|${message.event_date} · ${message.author}|"></p><p style="white-space:pre-wrap;overflow-wrap:anywhere" th:text="${message.body}"></p><p th:each="f:${files}"><a th:href="@{/message-files/{id}(id=${f.id})}" th:text="${f.name}"></a></p></article><details class="card" th:if="${message.kind == 'REMARK' and message.author_id == user.id}"><summary>Исправить замечание</summary><form th:action="@{/messages/{id}/correct(id=${message.id})}" method="post" class="fields"><input type="hidden" name="version" th:value="${message.version}"><label class="wide">Текст<textarea name="body" rows="6" maxlength="10000" required th:text="${message.body}"></textarea></label><label class="wide">Причина исправления<input name="reason" maxlength="1000" required></label><button>Сохранить исправление</button></form></details><section th:unless="${#lists.isEmpty(history)}"><h2>История исправлений</h2><article class="card" th:each="h:${history}"><p th:text="|${h.changed_at} · ${h.full_name}|"></p><p>Прежний текст</p><p style="white-space:pre-wrap" th:text="${h.old_body}"></p><p>Новый текст</p><p style="white-space:pre-wrap" th:text="${h.new_body}"></p><p th:text="${h.reason}"></p></article></section></main></body></html>
