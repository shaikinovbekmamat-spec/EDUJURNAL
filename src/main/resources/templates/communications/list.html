<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Объявления и замечания — EduJournal</title><link rel="stylesheet" href="/css/academic.css"><link rel="stylesheet" href="/css/navigation.css"><link rel="stylesheet" href="/css/journal-browser.css"></head><body class="app-shell records-app"><aside th:replace="~{academic/layout :: sidebar}"></aside><main class="workspace records-workspace"><header class="records-header"><h1 th:text="${kind == 'REMARK' ? 'Замечания' : 'Объявления'}"></h1><a class="button" th:if="${user.role.name() == 'TEACHER' or (user.role.name() == 'DIRECTOR' and kind != 'REMARK')}" th:href="@{/messages/new(kind=${kind})}">Создать запись</a></header><p th:if="${#lists.isEmpty(rows)}">Доступных записей пока нет.</p><article class="records-panel" th:each="m:${rows}"><h2><a th:href="@{/messages/{id}(id=${m.id})}" th:text="${m.title}"></a></h2><p th:text="|${m.event_date} · ${m.author}|"></p><p style="white-space:pre-wrap;overflow-wrap:anywhere" th:text="${#strings.abbreviate(m.body,300)}"></p></article><nav class="pagination"><a th:if="${pageNumber > 0}" th:href="@{/messages(kind=${kind},page=${pageNumber - 1})}">Назад</a><span th:text="|Страница ${pageNumber + 1}|"></span><a th:if="${more}" th:href="@{/messages(kind=${kind},page=${pageNumber + 1})}">Далее</a></nav></main></body></html>
