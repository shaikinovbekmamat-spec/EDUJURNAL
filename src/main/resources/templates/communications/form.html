<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Объявления и замечания — EduJournal</title><link rel="stylesheet" href="/css/academic.css"><link rel="stylesheet" href="/css/navigation.css"><link rel="stylesheet" href="/css/journal-browser.css"></head><body class="app-shell records-app"><aside th:replace="~{academic/layout :: sidebar}"></aside><main class="workspace records-workspace"><h1 th:text="${kind == 'REMARK' ? 'Новое замечание' : 'Новое объявление'}"></h1><p><a th:href="@{/messages(kind=${kind})}">К списку</a></p><form th:if="${kind == 'REMARK'}" method="get" class="filters"><input type="hidden" name="kind" value="REMARK"><label>Класс<select name="classId" required><option value="">Выберите класс</option><option th:each="c:${classes}" th:value="${c.id}" th:selected="${c.id == classId}" th:text="${c.name}"></option></select></label><button>Показать учеников</button></form><form th:action="@{/messages}" method="post" enctype="multipart/form-data" class="card fields"><input type="hidden" name="token" th:value="${token}"><input type="hidden" name="kind" th:value="${kind}"><label class="wide">Заголовок<input name="title" maxlength="200" required></label><label class="wide">Текст<textarea name="body" rows="8" maxlength="10000" required style="font:inherit;width:100%"></textarea></label><label>Дата<input type="date" name="date"></label><th:block th:if="${kind == 'ANNOUNCEMENT'}"><label>Классы<select name="classIds" multiple size="6"><option th:each="c:${classes}" th:value="${c.id}" th:text="${c.name}"></option></select><small th:text="${user.role.name() == 'DIRECTOR' ? 'Без выбранных классов — вся школа. Для нескольких классов удерживайте Ctrl.' : 'Выберите назначенные классы.'}"></small></label><label>Подгруппа (необязательно)<select name="subgroupId"><option value="">Весь класс</option><option th:each="g:${subgroups}" th:value="${g.id}" th:text="|${g.class_name} · ${g.name}|"></option></select><small>Для подгруппы выберите только один класс.</small></label></th:block><th:block th:if="${kind == 'REMARK'}"><label>Ученик<select name="studentId" required><option value="">Выберите ученика</option><option th:each="s:${students}" th:value="${s.id}" th:text="${s.full_name}"></option></select></label><label>Урок (необязательно)<select name="lessonId"><option value="">Без привязки</option><option th:each="l:${lessons}" th:value="${l.id}" th:text="|${l.lesson_date} ${l.start_time} · ${l.name}|"></option></select></label><p class="wide notice">Замечание доступно ученику, подтверждённым родителям, классному руководителю и директору.</p></th:block><label class="wide">Вложения<input type="file" name="files" multiple accept=".pdf,.png,.jpg,.jpeg,.docx"><small>До 5 файлов, не более 10 МБ каждый.</small></label><button>Опубликовать</button></form></main></body></html>
